name: On Push trigger

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate
    strategy:
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - name: 📦 Setup pnpm, Node and dependencies
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true
      - name: 🏗️ Build
        run: pnpm run build
      - name: 📏 Lint
        run: pnpm run lint
      - name: 🧹 Format
        run: pnpm run fmt:check
      - name: 🛠️ Typecheck
        run: pnpm run typecheck
      - name: 📋 Coverage
        run: pnpm run coverage
      - name: 🔎 Check exports
        run: pnpm run check-exports
